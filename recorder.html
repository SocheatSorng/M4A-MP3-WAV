<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9fd">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Voice recorder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <script defer src="language.js"></script>
  <script defer src="recorder.js"></script>
</head>
<body>
  <main class="converter-page recorder-page">
    <nav class="app-nav" aria-label="Audio tools navigation" data-i18n-aria-label="audioToolsNavigation">
      <div class="nav-links"><a class="nav-link" href="index.html" data-i18n="converter">Converter</a><a class="nav-link" href="duration.html" data-i18n="durationCalculator">Duration calculator</a><a class="nav-link active" href="recorder.html" data-i18n="voiceRecorder">Voice recorder</a><a class="nav-link" href="ios-guide.html" data-i18n="iosGuideNavigation">Guide page</a><button class="lang-toggle" type="button" aria-label="Toggle language" data-i18n-aria-label="toggleLanguage" aria-pressed="false"><span data-lang="en">EN</span><span>/</span><span data-lang="kh">KH</span></button></div>
    </nav>

    <section class="recorder-hero">
      <span class="result-label" data-i18n="recorderLabel">VOICE RECORDER</span>
      <h1 data-i18n="recorderTitle">Give your voice a file.</h1>
      <p class="lede" data-i18n="recorderLede">Record from your microphone and download a clean MP3. Everything stays in this browser.</p>
    </section>

    <section class="recorder-workspace" aria-label="Voice recorder" data-i18n-aria-label="voiceRecorderRegion">
      <div class="recorder-stage" id="recorderStage">
        <div class="level-meter" id="levelMeter" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="record-readout"><span class="record-state" id="recordState" data-i18n="readyToRecord">Ready to record</span><strong id="recordTime">00:00</strong></div>
        <button class="record-button" id="recordButton" type="button"><span class="record-button-icon" aria-hidden="true"></span><span id="recordButtonLabel" data-i18n="startRecording">Start recording</span></button>
        <p class="recorder-status" id="recorderStatus" role="status" data-i18n="micPermissionNote">Your microphone stays private and local.</p>
      </div>

      <div class="recording-results" id="recordingResults" aria-live="polite"></div>
    </section>

    <footer class="site-footer"><span class="footer-brand" data-i18n="audioTools">AUDIO TOOLS</span><span class="footer-note" data-i18n="ffmpegLocal">LOCAL PROCESSING · FFMPEG.WASM</span><span class="footer-year">2026</span></footer>
  </main>
</body>
</html>
