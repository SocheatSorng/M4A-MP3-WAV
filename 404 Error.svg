    <rect class="bar peak" x="172" y="192" width="8" height="58" rx="4" style="animation-delay: .24s" />
    <rect class="bar peak" x="188" y="210" width="8" height="40" rx="4" style="animation-delay: .16s" />
    <rect class="bar peak" x="204" y="196" width="8" height="54" rx="4" style="animation-delay: .08s" />
