<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="digitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef1fb" />
      <stop offset="100%" stop-color="#ff7a7a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ff7a7a" stop-opacity=".45" />
      <stop offset="100%" stop-color="#ff7a7a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .digits { fill: url(#digitGrad); font-family: "Space Grotesk", "Segoe UI", sans-serif; filter: drop-shadow(0 0 20px rgba(255,122,122,.4)); }
    .bar { transform-box: fill-box; transform-origin: bottom; }
    .peak { fill: #ff7a7a; filter: drop-shadow(0 0 5px rgba(255,122,122,.5)); animation: pulse 1.8s ease-in-out infinite; }
    .quiet { fill: #eef1fb; }
    .search-dot { fill: #ff7a7a; transform-box: fill-box; transform-origin: center; animation: search 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.35); } }
    @keyframes search { 0%, 100% { transform: scale(1); opacity: .35; } 50% { transform: scale(1.6); opacity: .9; } }
  </style>
  <rect x="0" y="0" width="480" height="300" fill="url(#glow)" />
  <text x="240" y="150" text-anchor="middle" class="digits" font-weight="700" font-size="132">404</text>
  <g>
    <rect class="bar quiet" x="44" y="240" width="8" height="10" rx="4" opacity=".5" />
    <rect class="bar quiet" x="60" y="232" width="8" height="18" rx="4" opacity=".42" />
    <rect class="bar quiet" x="76" y="220" width="8" height="30" rx="4" opacity=".36" />
